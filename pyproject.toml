[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "slope3d"
version = "0.1.0"
description = "Standalone 3D limit-equilibrium rock-slope stability with a 3D Hoek-Brown (EJC eq. 4.21) strength model - a port of the GENG5512 thesis workbook"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
    "pyyaml>=6.0",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
report = ["matplotlib>=3.8"]
gui = ["matplotlib>=3.8", "plotly>=5.18", "streamlit>=1.50"]
dev = ["pytest>=8", "matplotlib>=3.8", "plotly>=5.18", "streamlit>=1.50"]
exe = ["pyinstaller>=6", "matplotlib>=3.8", "plotly>=5.18", "streamlit>=1.50"]

[project.scripts]
slope3d = "slope3d.cli:main"

[tool.setuptools.packages.find]
include = ["slope3d*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: slow regression tests (mesh study to 320x320 / 2560 slices, exact-EJC thresholds); run with -m slow"]
addopts = "-m 'not slow'"
